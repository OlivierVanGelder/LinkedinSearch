name: linkedin-serp-lists

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Bedrijfsnaam"
        required: true
      extra:
        description: "Extra context zoals plaats of domein"
        required: false
        default: ""
      tags:
        description: "Tags om te gebruiken in n8n, gescheiden door komma's"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SERP script
        run: |
          python serp_linkedin_lists_updated.py \
            --company "${{ inputs.company }}" \
            --extra "${{ inputs.extra }}" \
            --tags "${{ inputs.tags }}" \
            --max 10 \
            > output.json

      - name: Send result to n8n webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data @output.json \
            https://rbmedia.app.n8n.cloud/webhook/3c0d49a0-66bf-4a3c-a718-dc4f8d03669d

      - name: Validate JSON
        run: |
          python -c "import json; json.load(open('output.json','r',encoding='utf-8')); print('json ok')"